name: Monorepo CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Detect Changes (Monorepo Path Filter)
  changes:
    name: Detect Changed Folders
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'be/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'fe/**'
              - '.github/workflows/ci.yml'

  # 2. Backend CI (Laravel)
  backend-ci:
    name: Backend CI (Laravel)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: be/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('be/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare Environment & Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check Code Style (Pint)
        run: ./vendor/bin/pint --test

      - name: Run Pest / PHPUnit Tests
        run: php artisan test

  # 3. Frontend CI (React Router v7)
  frontend-ci:
    name: Frontend CI (React Router)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Build Application
        run: npm run build

